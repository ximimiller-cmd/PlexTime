name: Build Lumi Plugin
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Download Lumi Core
        run: |
          URL=$(curl -s https://github.com | grep "browser_download_url.*\.jar" | cut -d '"' -f 4 | head -n 1)
          curl -L "$URL" -o lumi.jar
      - name: Build with Maven
        run: mvn clean package
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: NewPlugin
          path: target/*.jar
