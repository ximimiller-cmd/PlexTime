name: Build Lumi Plugin
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Get Lumi API
        run: |
          git clone --depth 1 https://github.com lumi-src
          cd lumi-src && mvn install -DskipTests -Dmaven.javadoc.skip=true || true
      - name: Build with Maven
        run: mvn clean package
      - name: Upload JAR
        uses: actions/upload-artifact@v5
        with:
          name: NewPlugin
          path: target/*.jar
